[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "frontal"
version = "1.0.0"
description = "Typed synchronous and asynchronous Python client for the Frontal API"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [{ name = "Frontal Labs", email = "sdk@frontal.dev" }]
keywords = ["frontal", "sdk", "api", "client"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.5,<5",
    "eval-type-backport>=0.2; python_version < '3.10'",
    "httpx>=0.27.2,<1",
    "pydantic>=2.10.6,<3",
]

[project.urls]
Homepage = "https://frontal.dev"
Documentation = "https://github.com/frontal-labs/sdk-python#readme"
Repository = "https://github.com/frontal-labs/sdk-python"
Issues = "https://github.com/frontal-labs/sdk-python/issues"
Changelog = "https://github.com/frontal-labs/sdk-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "respx>=0.22",
    "ruff>=0.9",
    "towncrier>=24.8",
]

[tool.hatch.build.targets.wheel]
packages = ["frontal_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "/frontal_sdk",
    "/README.md",
    "/LICENSE.md",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
anyio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["frontal_sdk"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# Pydantic v2 and AnyIO source use Python 3.10 syntax; CI exercises Python 3.9 runtime support.
python_version = "3.10"
strict = true
files = ["frontal_sdk"]
no_implicit_optional = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.towncrier]
package = "frontal_sdk"
filename = "CHANGELOG.md"
directory = "changelog.d"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/frontal-labs/sdk-python/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true
