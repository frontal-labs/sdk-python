name: Publish to PyPI

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build frontal distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Check formatting
        run: uv run --locked --no-sync --no-build ruff format --check .
      - name: Build distributions
        run: uv build
      - name: Smoke-check built distributions
        run: uv run --locked --no-sync --no-build python scripts/check_distribution.py
      - name: Lint
        run: uv run --locked --no-sync --no-build ruff check .
      - name: Type check
        run: uv run --locked --no-sync --no-build mypy --strict
      - name: Test sync, async, examples, and docs
        run: uv run --locked --no-sync --no-build python -m pytest
      - name: Check API contract
        run: uv run --locked --no-sync --no-build python scripts/check_contracts.py
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*,sbom.spdx.json
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.4.3
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 1
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.4.3
        with:
          name: frontal-sbom
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish frontal to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/frontal/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Publish with GitHub OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
