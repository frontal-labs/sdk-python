name: Python SDK CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Build distributions
        run: uv build
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy --strict
      - name: Test transport and models
        run: uv run python -m pytest tests/test_client.py
      - name: Run mocked examples
        run: uv run python -m pytest tests/test_examples.py
      - name: Execute README examples
        run: uv run python -m pytest tests/test_docs.py
      - name: Validate changelog fragments
        run: uv run towncrier build --draft
      - name: Check API contract
        run: uv run python scripts/check_contracts.py
