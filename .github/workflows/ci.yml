name: Python SDK CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: macos-latest
          - python-version: "3.12"
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Check formatting
        run: uv run --locked --no-sync --no-build ruff format --check .
      - name: Build distributions
        run: uv build
      - name: Smoke-check built distributions
        run: uv run --locked --no-sync --no-build python scripts/check_distribution.py
      - name: Lint
        run: uv run --locked --no-sync --no-build ruff check .
      - name: Type check
        run: uv run --locked --no-sync --no-build mypy --strict
      - name: Test transport and models
        run: uv run --locked --no-sync --no-build python -m pytest tests/test_client.py
      - name: Run mocked examples
        run: uv run --locked --no-sync --no-build python -m pytest tests/test_examples.py
      - name: Execute README examples
        run: uv run --locked --no-sync --no-build python -m pytest tests/test_docs.py
      - name: Check API contract
        run: uv run --locked --no-sync --no-build python scripts/check_contracts.py
