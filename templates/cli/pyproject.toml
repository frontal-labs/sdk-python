[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "frontal-python-cli-template"
version = "0.1.0"
description = "Python CLI starter using the Frontal SDK"
requires-python = ">=3.10"
dependencies = ["frontal-sdk>=0.1.0"]

[project.optional-dependencies]
dev = ["mypy>=1.15", "pytest>=8", "ruff>=0.9"]

[project.scripts]
frontal-cli = "frontal_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
