[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "frontal-python-async-template"
version = "0.1.0"
description = "Asyncio starter using the async Frontal SDK client"
requires-python = ">=3.9"
dependencies = ["frontal>=1.0.0"]

[project.optional-dependencies]
dev = ["mypy>=1.15", "pytest>=8", "ruff>=0.9"]

[project.scripts]
frontal-async = "frontal_async.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frontal_async"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src"]
