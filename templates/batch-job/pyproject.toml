[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "frontal-python-batch-template"
version = "0.1.0"
description = "Python batch job starter using the Frontal SDK"
requires-python = ">=3.9"
dependencies = ["frontal>=1.0.0"]

[project.optional-dependencies]
dev = ["mypy>=1.15,<2", "pytest>=8", "ruff>=0.9"]

[project.scripts]
frontal-batch = "frontal_batch.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frontal_batch"]

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# mypy parses Pydantic v2 and AnyIO dependencies using Python 3.10 syntax.
python_version = "3.10"
strict = true
files = ["src"]
